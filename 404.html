<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이지를 찾을 수 없어요 | 요니홀딩스</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/img/favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;align-items:center;justify-content:center;background:#070b24;color:#eef0ff;font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow:hidden;position:relative;padding:24px}
body::before{content:"";position:absolute;inset:-20%;z-index:0;background:radial-gradient(40% 55% at 78% 55%,rgba(84,214,170,.5),transparent 70%),radial-gradient(45% 40% at 18% 100%,rgba(230,80,160,.5),transparent 70%),radial-gradient(35% 35% at 45% 95%,rgba(140,80,240,.5),transparent 70%);filter:blur(30px)}
body::after{content:"";position:absolute;inset:0;z-index:0;background:repeating-linear-gradient(0deg,rgba(7,11,36,.5) 0 1px,transparent 1px 4px)}
.box{position:relative;z-index:1;text-align:center;max-width:520px}
.box img{height:56px;margin-bottom:24px}
.code{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:clamp(80px,18vw,140px);line-height:1;letter-spacing:-.04em;background:linear-gradient(95deg,#b19bff,#ef93e3 45%,#95e6d4);-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-size:22px;margin:18px 0 8px}
p{color:#c6c9e6;margin:0 0 32px}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
a.btn{padding:13px 22px;border-radius:999px;font-weight:600;text-decoration:none}
.p{background:#fff;color:#13132a}.g{border:1px solid rgba(255,255,255,.3);color:#fff}
</style>
</head>
<body>
<div class="box">
  <img src="/img/yh-white.png" alt="요니홀딩스">
  <div class="code">404</div>
  <h1>요청하신 페이지를 찾을 수 없어요</h1>
  <p>주소가 바뀌었거나 삭제된 페이지일 수 있어요.<br>홈으로 돌아가 원하시는 내용을 찾아보세요.</p>
  <div class="btns"><a class="btn p" href="/">홈으로 가기</a><a class="btn g" href="/#contact">광고 문의하기</a></div>
</div>
</body>
</html>
